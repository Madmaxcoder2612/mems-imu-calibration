name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: matlab-actions/setup-matlab@v2

      - name: Run calibration and sensor fusion
        uses: matlab-actions/run-command@v2
        with:
          command: main_mems_calibration; main_sensor_fusion

      - name: All eight figures were produced
        run: test "$(ls results/fig*.png | wc -l)" -eq 8
